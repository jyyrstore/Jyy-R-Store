name: deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: npm run verify
      # Connect the verified artifact to the chosen deployment platform after
      # production environment variables and platform secrets are provisioned.
