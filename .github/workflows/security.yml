name: security
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Secret scan
        run: |
          ! grep -RInE '(SUPABASE_SERVICE_ROLE_KEY|SUPABASE_SECRET_KEY|PAYMENT_WEBHOOK_SECRET|XENDIT_SECRET_KEY|XENDIT_WEBHOOK_TOKEN|SMTP_PASSWORD|SESSION_SECRET|CSRF_SECRET|ENCRYPTION_KEY)=([^[:space:]]+)' . --exclude-dir=.git --exclude-dir=node_modules --exclude='.env.example' --exclude='package-lock.json'
      - run: npm ci --ignore-scripts
      - run: npm run test:security
