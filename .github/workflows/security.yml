name: security
on:
  push:
  pull_request:
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --ignore-scripts
      - run: npm test -- tests/security
      - name: Secret scan
        run: |
          ! grep -RInE '(SUPABASE_SERVICE_ROLE_KEY|PAYMENT_WEBHOOK_SECRET|SMTP_PASSWORD|SESSION_SECRET)=([^[:space:]]+)' . --exclude-dir=.git --exclude='.env.example' --exclude='package-lock.json'
