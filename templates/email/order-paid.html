<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{title}}</title>
  <style>
    body{
      margin:0;
      padding:24px;
      background:#0b0b0b;
      color:#f5f5f5;
      font-family:Arial,Helvetica,sans-serif;
    }
    .card{
      max-width:620px;
      margin:0 auto;
      padding:24px;
      background:#151515;
      border:1px solid #2a2a2a;
      border-radius:16px;
    }
    h1{
      margin:0 0 16px;
      font-size:22px;
    }
    .body{
      white-space:pre-wrap;
      color:#d7d7d7;
      line-height:1.7;
    }
    .footer{
      margin-top:22px;
      padding-top:14px;
      border-top:1px solid #292929;
      color:#888;
      font-size:12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>{{title}}</h1>
    <div class="body">{{body}}</div>
    <div class="footer">JyyR Store · Informasi pesanan otomatis</div>
  </div>
</body>
</html>
